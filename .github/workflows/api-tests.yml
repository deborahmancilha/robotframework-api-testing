name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes smoke
        run: python -m robot --include smoke --outputdir results/smoke tests
      - name: Publicar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-smoke-reports
          path: results/smoke/
          retention-days: 14
          if-no-files-found: warn

  full:
    name: Suíte completa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar suíte completa
        run: python -m robot --outputdir results/full tests
      - name: Publicar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-full-reports
          path: results/full/
          retention-days: 14
          if-no-files-found: warn
